<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatterBox — Real-Time Chat</title>
  <script src="/socket.io/socket.io.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #21262d;
      --border: rgba(255,255,255,0.08);
      --text: #e6edf3;
      --muted: #7d8590;
      --accent: #4f9cf9;
      --radius: 12px;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Join Screen ── */
    #join-screen {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, #0f1a2e 0%, #0d1117 70%);
    }

    .join-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .join-card h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .join-card h1 span { color: var(--accent); }

    .join-card p {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    .join-card input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      padding: 0.85rem 1rem;
      margin-bottom: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .join-card input:focus { border-color: var(--accent); }
    .join-card input::placeholder { color: var(--muted); }

    .join-btn {
      width: 100%;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: white;
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      padding: 0.85rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .join-btn:hover { opacity: 0.85; }

    /* ── Chat Screen ── */
    #chat-screen {
      flex: 1;
      display: none;
      flex-direction: column;
    }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.5rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .room-info h2 {
      font-size: 1rem;
      font-weight: 600;
    }

    .room-info span {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .online-count {
      background: rgba(79,156,249,0.12);
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
    }

    .chat-body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Messages */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 2px; }

    .msg {
      max-width: 70%;
      padding: 0.6rem 0.9rem;
      border-radius: 14px;
      font-size: 0.9rem;
      line-height: 1.5;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg.own {
      align-self: flex-end;
      background: var(--accent);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .msg.other {
      align-self: flex-start;
      background: var(--surface2);
      border-bottom-left-radius: 4px;
    }

    .msg.system {
      align-self: center;
      background: transparent;
      color: var(--muted);
      font-size: 0.8rem;
      padding: 0.2rem 0;
    }

    .msg-author {
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 3px;
    }

    .msg-time {
      font-size: 0.7rem;
      opacity: 0.6;
      margin-top: 2px;
      text-align: right;
    }

    /* Sidebar */
    .sidebar {
      width: 200px;
      background: var(--surface);
      border-left: 1px solid var(--border);
      padding: 1rem;
      overflow-y: auto;
    }

    .sidebar h3 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    .user-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      font-size: 0.85rem;
    }

    .user-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Typing indicator */
    #typing-indicator {
      padding: 0 1.5rem 0.25rem;
      font-size: 0.8rem;
      color: var(--muted);
      min-height: 20px;
    }

    /* Input area */
    .chat-input-area {
      padding: 1rem 1.5rem;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
    }

    #msg-input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      padding: 0.7rem 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    #msg-input:focus { border-color: var(--accent); }
    #msg-input::placeholder { color: var(--muted); }

    .send-btn {
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 1.2rem;
      width: 44px;
      cursor: pointer;
      transition: opacity 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .send-btn:hover { opacity: 0.85; }
  </style>
</head>
<body>

<!-- Join Screen -->
<div id="join-screen">
  <div class="join-card">
    <h1>Chatter<span>Box</span></h1>
    <p>Real-time chat. No account needed.</p>
    <input type="text" id="username-input" placeholder="Your username" maxlength="30" />
    <input type="text" id="room-input" placeholder="Room name (default: General)" maxlength="30" />
    <button class="join-btn" onclick="joinRoom()">Join Room →</button>
  </div>
</div>

<!-- Chat Screen -->
<div id="chat-screen">
  <div class="chat-header">
    <div class="room-info">
      <h2 id="room-title">General</h2>
      <span id="my-username"></span>
    </div>
    <div class="online-count"><span id="user-count">1</span> online</div>
  </div>

  <div class="chat-body">
    <div style="flex:1; display:flex; flex-direction:column; overflow:hidden;">
      <div id="messages"></div>
      <div id="typing-indicator"></div>
      <div class="chat-input-area">
        <input type="text" id="msg-input" placeholder="Type a message..." maxlength="500" />
        <button class="send-btn" onclick="sendMessage()">➤</button>
      </div>
    </div>
    <div class="sidebar">
      <h3>Online</h3>
      <div id="user-list"></div>
    </div>
  </div>
</div>

<script>
  const socket = io();
  let myUsername = '';
  let myRoom = '';
  let typingTimeout;

  function joinRoom() {
    const username = document.getElementById('username-input').value.trim();
    const room = document.getElementById('room-input').value.trim() || 'general';
    if (!username) return alert('Please enter a username.');

    myUsername = username;
    myRoom = room;

    socket.emit('join', { username, roomId: room.toLowerCase().replace(/\s+/g, '-'), roomName: room });

    document.getElementById('join-screen').style.display = 'none';
    document.getElementById('chat-screen').style.display = 'flex';
    document.getElementById('room-title').textContent = `# ${room}`;
    document.getElementById('my-username').textContent = `Logged in as ${username}`;
    document.getElementById('msg-input').focus();
  }

  function sendMessage() {
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    if (!text) return;
    socket.emit('message', { text });
    socket.emit('typing', { isTyping: false });
    input.value = '';
  }

  function formatTime(iso) {
    return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function appendMessage(msg) {
    const container = document.getElementById('messages');
    const el = document.createElement('div');

    if (msg.type === 'system') {
      el.className = 'msg system';
      el.textContent = msg.text;
    } else {
      const isOwn = msg.author === myUsername;
      el.className = `msg ${isOwn ? 'own' : 'other'}`;

      if (!isOwn) {
        const author = document.createElement('div');
        author.className = 'msg-author';
        author.textContent = msg.author;
        author.style.color = msg.color;
        el.appendChild(author);
      }

      const text = document.createElement('div');
      text.textContent = msg.text;
      el.appendChild(text);

      const time = document.createElement('div');
      time.className = 'msg-time';
      time.textContent = formatTime(msg.timestamp);
      el.appendChild(time);
    }

    container.appendChild(el);
    container.scrollTop = container.scrollHeight;
  }

  socket.on('history', (messages) => {
    messages.forEach(appendMessage);
  });

  socket.on('message', appendMessage);

  socket.on('room_users', (users) => {
    document.getElementById('user-count').textContent = users.length;
    document.getElementById('user-list').innerHTML = users.map(u =>
      `<div class="user-item">
        <div class="user-dot" style="background:${u.color}"></div>
        <span>${u.username}</span>
      </div>`
    ).join('');
  });

  let typingUsers = {};
  socket.on('user_typing', ({ username, isTyping }) => {
    if (isTyping) {
      typingUsers[username] = true;
    } else {
      delete typingUsers[username];
    }
    const names = Object.keys(typingUsers);
    const el = document.getElementById('typing-indicator');
    el.textContent = names.length > 0
      ? `${names.join(', ')} ${names.length === 1 ? 'is' : 'are'} typing...`
      : '';
  });

  document.getElementById('msg-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    } else {
      socket.emit('typing', { isTyping: true });
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => socket.emit('typing', { isTyping: false }), 2000);
    }
  });

  document.getElementById('username-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('room-input').focus();
  });

  document.getElementById('room-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') joinRoom();
  });
</script>
</body>
</html>
